<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Family 😍</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#10152b">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/animations.css">

<link rel="apple-touch-icon"
href="assets/icon-180.png">

</head>

<body>

<div id="app">

<!-- LOGIN -->

<section id="loginScreen"
class="screen active">

<div class="glass login-box">

<div class="logo">
😍
</div>

<h1>Family</h1>

<p class="subtitle">
Наша семья — наша вселенная 🌌
</p>


<input id="login"
placeholder="Логин"
autocomplete="username">


<input id="password"
type="password"
placeholder="Пароль"
autocomplete="current-password">


<button id="loginBtn">
Войти
</button>


<div id="loginError"></div>

</div>

</section>



<!-- MAIN APP -->

<section id="mainScreen"
class="screen">


<header class="top">

<div>

<h2>
😍 Family
</h2>

<span id="onlineStatus">
семья
</span>

</div>


<button id="themeBtn">
🌌
</button>

</header>



<main id="content">


<div id="chatView"
class="page active">


<div id="messages"
class="messages">

</div>


<div class="input-area">

<button id="emojiBtn">
😊
</button>


<input id="messageInput"
placeholder="Сообщение...">


<button id="sendBtn">
➤
</button>


<button id="voiceBtn">
🎙️
</button>

</div>


</div>



<div id="familyView"
class="page">

<h2>
👨‍👩‍👧 Семья
</h2>

<div id="usersList"></div>

</div>



<div id="profileView"
class="page">

<h2>
👤 Профиль
</h2>

<div id="profileCard">

</div>

</div>



<div id="settingsView"
class="page">

<h2>
⚙️ Настройки
</h2>


<button>
🔔 Уведомления
</button>


<button>
🎵 Звуки
</button>


<button>
🌌 Тема
</button>


</div>


</main>



<nav class="bottom-nav">

<button data-page="chatView">
🏠
<span>Чат</span>
</button>


<button data-page="familyView">
👨‍👩‍👧
<span>Семья</span>
</button>


<button data-page="profileView">
👤
<span>Профиль</span>
</button>


<button data-page="settingsView">
⚙️
<span>Настройки</span>
</button>

</nav>


</section>

</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/profile.js"></script>
<script src="js/settings.js"></script>
<script src="js/sound.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>


<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"sw.js"
);

}

</script>


</body>
</html>
